app = "medplum-redis"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "sh /entrypoint.sh"

[[services]]
  internal_port = 6379
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]  # Map the service to the "app" process

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services.volume]]
  source = "medplum_redis_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2