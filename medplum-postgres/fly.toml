app = "medplum-postgres"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POSTGRES_USER = "medplum"
  POSTGRES_PASSWORD = "medplum"

[[services]]
  internal_port = 5432
  protocol = "tcp"
  auto_stop_machines = "suspend" 
  auto_start_machines = true 
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.volume]]
    source = "medplum_postgres_data"
    destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1